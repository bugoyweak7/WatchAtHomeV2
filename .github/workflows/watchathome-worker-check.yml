name: WatchAtHome Worker Checks

on:
  push:
    branches:
      - setup/firebase-cloudflare-zero-cost
    paths:
      - "premium-worker/**"
      - ".github/workflows/watchathome-worker-check.yml"
  pull_request:
    branches:
      - setup/firebase-cloudflare-zero-cost
    paths:
      - "premium-worker/**"
      - ".github/workflows/watchathome-worker-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-check:
    name: TypeScript and schema tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: premium-worker
    steps:
      - name: Checkout approved branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript compilation check
        run: npm run check
      - name: Local SQLite schema tests
        run: npm run test:schema
      - name: Mocked D1 account and device API tests
        run: npm run test:worker
      - name: Worker HTTP and Firebase authentication tests
        run: npm run test:http
      - name: AES-GCM encryption and key-rotation tests
        run: npm run test:crypto
      - name: Encrypted provider and media-server storage tests
        run: npm run test:credentials
      - name: Pepper-protected profile PIN verifier tests
        run: npm run test:pin
      - name: Persisted profile PIN lockout tests
        run: npm run test:pin-store

      - name: D1-backed API rate-limit tests
        run: npm run test:rate-limit

      - name: Profile CRUD and settings sync tests
        run: npm run test:profiles

      - name: Profile add-on plugin and collection sync tests
        run: npm run test:profile-sync
