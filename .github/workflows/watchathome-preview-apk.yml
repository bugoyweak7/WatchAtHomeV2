name: WatchAtHome Preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchathome-preview-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-preview-apk:
    name: Build Play Store debug APK with Preview Worker
    if: github.ref == 'refs/heads/setup/firebase-cloudflare-zero-cost'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_WORKER_BASE_URL: https://setup-firebase-cloudflare-zero-cost-watchathome-premium-api.adminenzoreviewer.workers.dev
    steps:
      - name: Checkout approved branch
        uses: actions/checkout@v4
        with:
          ref: setup/firebase-cloudflare-zero-cost

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Preview-only runtime properties
        run: |
          touch local.properties
          printf '\nCLOUDFLARE_WORKER_BASE_URL=%s\n' "$CLOUDFLARE_WORKER_BASE_URL" >> local.properties

      - name: Run Firebase Auth session manager tests
        run: ./gradlew :composeApp:testAndroidHostTest --tests 'com.nuvio.app.core.auth.FirebaseAuthSessionManagerTest' -Pnuvio.android.distribution=playstore -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Build Play Store debug APK
        run: ./gradlew :androidApp:assemblePlaystoreDebug -Pnuvio.android.distribution=playstore -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: watchathome-preview-playstore-debug-apk
          path: androidApp/build/outputs/apk/playstore/debug/*.apk
          if-no-files-found: error
          retention-days: 7
